# deploy/docker-compose.coolify.yml
# Wird von Hand in Coolify (Docker Compose Empty) eingefügt; Coolify liest es nicht aus dem Repo.
# PostgreSQL läuft als eigene Coolify-Ressource; app, worker und scheduler hängen deshalb
# zusätzlich im externen Netz "coolify", in dem auch die Datenbank erreichbar ist.
# Alle ${...}-Werte werden in Coolify unter Environment Variables gesetzt – nie hier eintragen.

x-env: &env
  APP_NAME: Filmlog
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-https://filmlog.einsle.cloud}
  APP_LOCALE: de
  APP_FALLBACK_LOCALE: en
  APP_TIMEZONE: Europe/Berlin
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-filmlog}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_LIFETIME: "10080"
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  TMDB_TOKEN: ${TMDB_TOKEN}
  PLEX_WEBHOOK_SECRET: ${PLEX_WEBHOOK_SECRET}
  PLEX_URL: ${PLEX_URL}
  PLEX_TOKEN: ${PLEX_TOKEN}
  FILMLOG_ADMIN_EMAIL: ${FILMLOG_ADMIN_EMAIL}
  # AWS SES per SMTP (Port 587, STARTTLS). Zugangsdaten = SES-SMTP-Credentials, nicht der AWS-Access-Key.
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:-email-smtp.eu-central-1.amazonaws.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: Filmlog

services:
  app:
    image: ghcr.io/roberteinsle/filmlog:${APP_TAG:-latest}
    pull_policy: always
    environment:
      <<: *env
      AUTORUN_ENABLED: "true"
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    image: ghcr.io/roberteinsle/filmlog:${APP_TAG:-latest}
    pull_policy: always
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120"]
    stop_signal: SIGTERM
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: ghcr.io/roberteinsle/filmlog:${APP_TAG:-latest}
    pull_policy: always
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-storage:

networks:
  coolify:
    external: true
